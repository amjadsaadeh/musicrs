[package]
name = "musicrs"
version = "0.2.0"
edition = "2024"
# The lowest Rust version the crate and its dependencies build with (nalgebra 0.35 needs 1.89)
rust-version = "1.89"
description = "Rust port of the MUSIC (MUltiple SIgnal Classification) algorithm for Direction-of-Arrival estimation"
license = "MIT"

[lib]
name = "musicrs"
path = "src/lib.rs"

[dependencies]
nalgebra    = "0.35"
num-complex = "0.4"
rustfft     = "6"
realfft     = "3"
faer        = "0.24"

[dev-dependencies]
hound  = "3.5.1"
approx = "0.5"
